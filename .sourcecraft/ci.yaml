# SourceCraft CI: сборка ядра и прогон юнит-тестов на каждый push.
# Сборка Qt-интерфейса под Windows будет добавлена на этапе 8 (см. docs/plan.md).
on:
  push:
    - workflows: [build-and-test]

workflows:
  build-and-test:
    tasks:
      - name: core-tests
        cubes:
          - name: build-and-run-tests
            image: docker.io/library/gcc:14
            script:
              - g++ -std=c++20 -Wall -Wextra -Werror -Isrc -Itests
                -o fp_core_tests
                src/core/template/template.cpp
                src/core/template/textutil.cpp
                tests/template_tests.cpp
              - ./fp_core_tests
